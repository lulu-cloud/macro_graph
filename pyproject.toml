[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "macro-graph"
version = "0.1.0"
description = "Evidence-led macro and U.S. technology industry research system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27,<1",
  "networkx>=3.2,<3.3; python_version < '3.10'",
  "networkx>=3.3,<4; python_version >= '3.10'",
  "PyYAML>=6.0,<7",
  "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
macro-graph-daily = "macro_graph.jobs.daily_job:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_graph"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
